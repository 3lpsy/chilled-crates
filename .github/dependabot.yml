version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current (security patches for the
  # workflow's third-party actions arrive as PRs).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Rust dependency updates.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly

  # Base-image updates for the Dockerfile.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
